tier_a_api:
  - name: NVD API 2.0
    url: https://services.nvd.nist.gov/rest/json/cves/2.0
    kind: api_json
    note: 按 pubStartDate 拉过去48h，CVSS>=7.0；无key限速 5次/30秒，脚本单次请求
    status: active
  - name: CISA Known Exploited Vulnerabilities (KEV)
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    kind: json_feed
    note: 在野利用目录，dateAdded 近7天未入库的全部收，不看CVSS
    status: active
  - name: CVE.org / CVE API
    url: https://cveawg.mitre.org/api/cve/CVE-YYYY-NNNNN
    kind: api_json
    note: CVE记录本身比NVD早几天，用于补描述和参考链接；按CVE号逐个查
    status: active
  - name: GitHub Advisory Database (GHSA)
    url: https://api.github.com/advisories
    kind: api_json
    note: 开源组件最快，published过去48h，severity critical/high；无key 60次/小时
    status: active
  - name: EUVD (ENISA European Vulnerability Database)
    url: https://euvd.enisa.europa.eu/api/vulnerability
    kind: api_json
    note: 欧洲库，常有NVD之外的EPSS/KEV标注
    status: active
  - name: CIRCL Vulnerability-Lookup
    url: https://vulnerability.circl.lu/api/last
    kind: api_json
    note: 聚合85个源，含CNVD/CNNVD镜像，用于补中文源和冷门源
    status: active
  - name: FIRST EPSS
    url: https://api.first.org/data/v1/epss
    kind: api_json
    note: 只作排序参考，不单独入库：EPSS>0.5 或进KEV的优先
    status: active

