# 每日新源发现 — 见 SOURCES_DISCOVERY.md
# 发现渠道（每天都要跑，至少2条搜索）：
# 1. browser.search: "new vulnerability disclosure CVE-2026" / "CVE-2026 PoC GitHub" / "0day disclosed"
# 2. browser.search zh: "新披露漏洞 CVE 厂商公告" / "0day 漏洞 公开"
# 3. social.search: X/微博/GitHub 过去24h的 CVE 披露
# 4. 从当天新入库的CVE反查：它的 references 里出现的新厂商/研究者域名，核实后加源
# 纳入标准（2026-11-10 改后）：只有1条硬门槛——可复现/可核实（有CVE号，或厂商公告，或详细PoC+产品+版本可复核）。
# CVE号不是必须的：底库59条无CVE（cve: 无（业务逻辑/实现缺陷/配置缺陷）），无CVE用 YYYY-MM-DD-产品-类型.md 文件名+ cve: 无（原因）写法。
# 公开可达/30天内更新/覆盖方向清楚不是门槛：前者是核实前提（看不到全文先记待核实），后两者只决定盯的频率和分类标签。
# 不纳入：纯转载/营销号、只有截图无链接无产品版本、假PoC（无产品无版本无步骤）。
