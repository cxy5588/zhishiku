# tier: A=机器可读API/JSON（脚本直拉） B=厂商PSIRT RSS/页面（agent每天查） C=研究者第一手（agent每天搜） D=中文源/聚合（脚本+agent）
# status: active / needs_key / rss_only / manual_check
